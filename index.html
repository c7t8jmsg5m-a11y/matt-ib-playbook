<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Matt IB Playbook · Family access</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0b0f14; --panel:#141c26; --ink:#f3efe6; --muted:#9aa5b1; --gold:#d4b483; --coral:#e07a5f; --line:rgba(232,220,196,.14);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:"IBM Plex Sans",system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(900px 500px at 20% -10%, rgba(212,180,131,.14), transparent 55%),
      var(--bg);
    padding:24px;
  }
  .card {
    width:min(440px,100%);
    background:linear-gradient(180deg,#1a2431,#141c26);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    box-shadow:0 24px 80px rgba(0,0,0,.45);
  }
  .eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0 0 10px; }
  h1 { font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:34px; line-height:1; margin:0 0 10px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 18px; font-size:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:8px; }
  input {
    width:100%; border-radius:12px; border:1px solid var(--line); background:#0b0f14;
    color:var(--ink); padding:14px 14px; font-size:15px; outline:none;
  }
  input:focus { border-color:rgba(212,180,131,.55); }
  button {
    width:100%; margin-top:14px; border:0; border-radius:999px; padding:14px 16px;
    background:linear-gradient(180deg,#f0d7a8,#d4b483); color:#1a1208; font-weight:600; font-size:14px;
    cursor:pointer; min-height:48px;
  }
  .err { color:#ffb3a1; font-size:13px; min-height:18px; margin-top:10px; }
  .fine { margin-top:16px; font-size:12px; color:#6d7885; line-height:1.45; }
</style>
</head>
<body>
  <div class="card" id="gate">
    <div class="eyebrow">Private · Family only</div>
    <h1>Matt IB Playbook</h1>
    <p>This page is locked. Enter the family access password Bobby shared. Bookmark this link after it unlocks.</p>
    <label for="pw">Family password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••••••" />
    <button id="go" type="button">Unlock playbook</button>
    <div class="err" id="err"></div>
    <div class="fine">Only Bobby, Matt, and Kerry should have the password. Content is encrypted in transit at rest on this host.</div>
  </div>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(password, salt, iter) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' },
    base,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );
}
async function unlock() {
  const err = document.getElementById('err');
  err.textContent = '';
  const password = document.getElementById('pw').value || '';
  if (!password) { err.textContent = 'Enter the password.'; return; }
  try {
    const res = await fetch('./payload.json?ts=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('Could not load protected payload');
    const payload = await res.json();
    const key = await deriveKey(password, b64(payload.salt), payload.iter || 250000);
    const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: b64(payload.nonce) },
      key,
      b64(payload.ct)
    );
    const html = new TextDecoder().decode(pt);
    sessionStorage.setItem('matt_ib_family_pw', password);
    // Blob navigation runs scripts reliably (document.write often does not).
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    location.replace(url);
  } catch (e) {
    err.textContent = 'Wrong password or failed to decrypt.';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
// Auto-unlock if password remembered this browser session
(async () => {
  const saved = sessionStorage.getItem('matt_ib_family_pw');
  if (saved) {
    document.getElementById('pw').value = saved;
    await unlock();
  }
})();
</script>
</body>
</html>
